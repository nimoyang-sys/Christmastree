<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>互動式聖誕樹</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        canvas {
            display: block;
        }
        #ui-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 15px;
            border-radius: 8px;
            pointer-events: auto;
            color: #eee;
            font-size: 14px;
        }
        #controls-panel button {
            display: block;
            width: 100%;
            padding: 8px 15px;
            margin-bottom: 10px;
            background-color: #ffd700;
            color: #333;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        #controls-panel button:hover {
            background-color: #ffe033;
        }
        #controls-panel button:last-child {
            margin-bottom: 0;
        }
        #merry-christmas-text {
            position: absolute;
            top: 5%;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Brush Script MT', 'Cinzel', cursive;
            font-size: 4em;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.7), 0 0 20px rgba(255, 215, 0, 0.5);
            pointer-events: none;
        }
        #webcam-feed {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            transform: scaleX(-1);
            z-index: 1;
            display: none;
        }
        #bottom-hint {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 15px;
            border-radius: 8px;
            color: #eee;
            font-size: 14px;
            pointer-events: auto;
        }

        /* Admin 相關樣式 */
        .admin-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }
        .admin-modal.active {
            display: flex;
        }
        .admin-box {
            background: rgba(20, 20, 20, 0.95);
            border: 1px solid rgba(255, 215, 0, 0.5);
            padding: 40px;
            text-align: center;
            max-width: 320px;
            border-radius: 8px;
        }
        .admin-box h2 {
            color: #ffd700;
            font-size: 14px;
            letter-spacing: 3px;
            margin-bottom: 25px;
            text-transform: uppercase;
        }
        .admin-box input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 215, 0, 0.3);
            color: #fff;
            font-size: 14px;
            text-align: center;
            outline: none;
            border-radius: 5px;
            transition: border-color 0.3s;
        }
        .admin-box input:focus {
            border-color: #ffd700;
        }
        .admin-box .error-msg {
            color: #ff4444;
            font-size: 11px;
            margin-top: 10px;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .admin-box .error-msg.show {
            opacity: 1;
        }
        .admin-box .close-btn {
            position: absolute;
            top: -40px;
            right: 0;
            color: #fff;
            font-size: 32px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .admin-box .close-btn:hover {
            background: rgba(255,255,255,0.2);
        }
        .secret-trigger {
            position: fixed;
            top: 0;
            left: 0;
            width: 50px;
            height: 50px;
            z-index: 100;
            cursor: default;
        }
        .admin-indicator {
            position: fixed;
            bottom: 20px;
            left: 20px;
            color: rgba(255, 215, 0, 0.6);
            font-size: 9px;
            letter-spacing: 1px;
            text-transform: uppercase;
            z-index: 5;
            display: none;
        }
        .admin-indicator.show {
            display: block;
        }
        #file-input { display: none; }

        /* Upload 區域 */
        .upload-section {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.2);
            display: none;
        }
        .upload-section.admin-enabled {
            display: block;
        }
        .upload-section label {
            display: block;
            width: 100%;
            padding: 8px 15px;
            background-color: #4CAF50;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
            transition: background-color 0.3s ease;
        }
        .upload-section label:hover {
            background-color: #45a049;
        }
        .manage-btn {
            display: block;
            width: 100%;
            padding: 8px 15px;
            background-color: #2196F3;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s ease;
        }
        .manage-btn:hover {
            background-color: #1976D2;
        }

        /* Photo Manager */
        .photo-manager {
            position: fixed;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.85);
            border: 1px solid rgba(255, 215, 0, 0.4);
            padding: 15px;
            max-height: 60vh;
            overflow-y: auto;
            z-index: 200;
            display: none;
            min-width: 200px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        .photo-manager.active {
            display: block;
        }
        .photo-manager h3 {
            color: #ffd700;
            font-size: 14px;
            margin: 0 0 15px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
        }
        .photo-manager .photo-item {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
            padding: 8px;
            background: rgba(255,255,255,0.05);
            border-radius: 4px;
        }
        .photo-manager .photo-thumb {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border: 1px solid rgba(255, 215, 0, 0.3);
            margin-right: 10px;
        }
        .photo-manager .photo-name {
            flex: 1;
            color: #fff;
            font-size: 10px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 80px;
        }
        .photo-manager .delete-btn {
            background: rgba(255, 68, 68, 0.8);
            border: none;
            color: #fff;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .photo-manager .delete-btn:hover {
            background: rgba(255, 68, 68, 1);
        }
        .photo-manager .no-photos {
            color: rgba(255,255,255,0.5);
            font-size: 10px;
            text-align: center;
            padding: 20px 0;
        }
        .photo-manager .close-manager {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            opacity: 0.7;
        }
        .photo-manager .close-manager:hover {
            opacity: 1;
        }

        /* Webcam wrapper */
        #webcam-wrapper {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 160px;
            height: 120px;
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 8px;
            overflow: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }
        #webcam-wrapper.active {
            opacity: 1;
        }
        .webcam-label {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0,0,0,0.7);
            color: #ffd700;
            font-size: 8px;
            text-align: center;
            padding: 3px;
            text-transform: uppercase;
        }

        /* Argon Logo */
        .argon-logo {
            position: fixed;
            bottom: 80px;
            right: 20px;
            z-index: 50;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .argon-logo img {
            height: 30px;
            width: auto;
        }
        .argon-logo:hover {
            opacity: 1;
        }

        /* Mobile */
        @media (max-width: 768px) {
            #merry-christmas-text {
                font-size: 2em;
            }
            #controls-panel {
                left: 10px;
                bottom: 10px;
                padding: 10px;
            }
            #bottom-hint {
                display: none;
            }
            .photo-manager {
                right: 10px;
                left: 10px;
                max-height: 50vh;
            }
            .argon-logo {
                bottom: 10px;
                right: 10px;
            }
            .argon-logo img {
                height: 24px;
            }
        }
    </style>

<body>

    <div id="ui-container">

            <div class="no-photos">No uploaded photos</div>
        </div>

    <script>
        // ============ ADMIN AUTHENTICATION ============
        // Change this password to your own secret password
        const ADMIN_PASSWORD = 'christmas2024';

        let isAdmin = false;
        let clickCount = 0;
        let clickTimer = null;

        // Check if already logged in (session storage)
        if (sessionStorage.getItem('adminLoggedIn') === 'true') {
            isAdmin = true;
            enableAdminMode();
        }

        function enableAdminMode() {
            isAdmin = true;
            sessionStorage.setItem('adminLoggedIn', 'true');
            document.getElementById('upload-section').classList.add('admin-enabled');
            document.getElementById('admin-indicator').classList.add('show');
            document.getElementById('admin-modal').classList.remove('active');
        }

        function showAdminModal() {
            document.getElementById('admin-modal').classList.add('active');
            document.getElementById('admin-password').value = '';
            document.getElementById('admin-password').focus();
            document.getElementById('error-msg').classList.remove('show');
        }

        function hideAdminModal() {
            document.getElementById('admin-modal').classList.remove('active');
        }

        // Triple-click on secret trigger area (top-left corner)
        document.getElementById('secret-trigger').addEventListener('click', function() {
            clickCount++;
            if (clickTimer) clearTimeout(clickTimer);

            if (clickCount >= 3) {
                clickCount = 0;
                if (!isAdmin) showAdminModal();
            }

            clickTimer = setTimeout(() => { clickCount = 0; }, 500);
        });

        // Ctrl+Shift+A shortcut
        document.addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === 'a') {
                e.preventDefault();
                if (!isAdmin) showAdminModal();
            }
        });

        // Close modal
        document.getElementById('close-modal').addEventListener('click', hideAdminModal);
        document.getElementById('admin-modal').addEventListener('click', function(e) {
            if (e.target === this) hideAdminModal();
        });

        // Password verification
        document.getElementById('admin-password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                if (this.value === ADMIN_PASSWORD) {
                    enableAdminMode();
                } else {
                    document.getElementById('error-msg').classList.add('show');
                    this.value = '';
                    setTimeout(() => {
                        document.getElementById('error-msg').classList.remove('show');
                    }, 2000);
                }
            }
        });

        // Photo Manager
        document.getElementById('manage-photos-btn').addEventListener('click', function() {
            document.getElementById('photo-manager').classList.add('active');
        });
        document.getElementById('close-manager').addEventListener('click', function() {
            document.getElementById('photo-manager').classList.remove('active');
        });

        // Track uploaded photos for management
        window.uploadedPhotos = [];

        // Add photo to manager list
        window.addPhotoToManager = function(fileName, url, storageRef) {
            window.uploadedPhotos.push({ fileName, url, storageRef });
            updatePhotoList();
        };

        // Update photo list UI
        function updatePhotoList() {
            const listEl = document.getElementById('photo-list');
            if (window.uploadedPhotos.length === 0) {
                listEl.innerHTML = '<div class="no-photos">No uploaded photos</div>';
                return;
            }
            listEl.innerHTML = window.uploadedPhotos.map((photo, index) => `
                <div class="photo-item" data-index="${index}">
                    <img class="photo-thumb" src="${photo.url}" alt="${photo.fileName}">
                    <span class="photo-name">${photo.fileName}</span>
                    <button class="delete-btn" onclick="deletePhoto(${index})">×</button>
                </div>
            `).join('');
        }

        // Delete photo function
        window.deletePhoto = async function(index) {
            const photo = window.uploadedPhotos[index];
            if (!photo) return;

            if (!confirm('Delete this photo?')) return;

            try {
                // Delete from Firebase Storage
                if (photo.storageRef) {
                    await window.firebaseStorage.ref(photo.storageRef).delete();
                    console.log('Deleted from Firebase:', photo.storageRef);
                }

                // Remove from local array
                window.uploadedPhotos.splice(index, 1);
                updatePhotoList();

                // Notify 3D scene to refresh (will be handled in module)
                if (window.removePhotoFromScene) {
                    window.removePhotoFromScene(index);
                }
            } catch (error) {
                console.error('Delete error:', error);
                alert('Failed to delete photo');
            }
        };
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { FilesetResolver, HandLandmarker } from '@mediapipe/tasks-vision';

        // --- CONFIGURATION (新版高級視覺效果) ---
        const CONFIG = {
            colors: {
                bg: 0x000000,
                champagneGold: 0xffd700,    // 金屬金
                deepGreen: 0x0a5f38,         // 啞光綠
                accentRed: 0xc41e3a,         // 聖誕紅
                snowWhite: 0xffffff,
                gingerbread: 0x8B4513,
                candyPink: 0xff69b4,
                iceBlue: 0x87ceeb,
            },
            particles: {
                count: 1200,      // 粒子總數
                dustCount: 800,   // 浮動塵埃（減少）
                snowCount: 2000,  // 漫天雪花數量
                treeHeight: 28,   // 樹高
                treeRadius: 10,   // 樹底部半徑
                scatterRadius: 35, // 散開時的範圍半徑
                photoCircleRadius: 18, // 照片圍成圈的半徑
                giftBoxCount: 8,  // 樹下禮盒
                stringLightCount: 100, // 閃爍燈光
                goldRingCount: 5  // 金色光環數量
            },
            camera: {
                z: 50             // 攝影機距離
            },
            transitionSpeed: 0.05  // 狀態切換時的飛行速度
        };

        // 狀態定義 - 使用新命名
        const STATES = {
            COLLAPSED: 'COLLAPSED',  // 合攏態 (聖誕樹)
            SCATTERED: 'SCATTERED',  // 散開態 (漂浮)
            FOCUS: 'FOCUS'           // 聚焦態 (查看照片)
        };

        const STATE = {
            mode: STATES.COLLAPSED,  // 初始為合攏態
            focusIndex: -1,
            focusTarget: null,
            hand: { detected: false, x: 0, y: 0 },
            rotation: { x: 0, y: 0 },
            autoRotate: true         // 初始自動旋轉
        };

        let scene, camera, renderer, composer;
        let mainGroup;
        let clock = new THREE.Clock();
        let particleSystem = [];
        let photoMeshGroup = new THREE.Group();
        let handLandmarker, video, webcamCanvas, webcamCtx;
        let caneTexture;

        async function init() {
            initThree();
            setupEnvironment();
            setupLights();
            createTextures();
            createParticles();
            createDust();
            createDefaultPhotos();
            setupPostProcessing();
            setupEvents();

            // Load photos from Firebase (all users can see)
            await loadPhotosFromFirebase();

            await initMediaPipe();

            const loader = document.getElementById('loader');
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 800);

            animate();
        }

        function initThree() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(CONFIG.colors.bg);
            // 添加一點環境霧氣，增加深度感
            scene.fog = new THREE.FogExp2(CONFIG.colors.bg, 0.005);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 5, CONFIG.camera.z);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            // 電影級色調映射
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            // 開啟陰影支持
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            // 直接渲染到 body
            document.body.appendChild(renderer.domElement);

            mainGroup = new THREE.Group();
            scene.add(mainGroup);
        }

        function setupEnvironment() {
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;
        }

        function setupLights() {
            // 高級燈光系統 - 金碧輝煌的氛圍

            // 環境光
            const ambient = new THREE.AmbientLight(0x444444, 0.6);
            scene.add(ambient);

            // 主光源 - 金色暖光
            const mainLight = new THREE.DirectionalLight(0xffd700, 2.5);
            mainLight.position.set(30, 30, 30);
            mainLight.castShadow = true;
            scene.add(mainLight);

            // 補光 - 紅色側光，增加節日氛圍
            const rimLight = new THREE.PointLight(0xff4400, 1.5, 100);
            rimLight.position.set(-25, 5, -25);
            scene.add(rimLight);

            // 底部向上打的綠光，照亮樹底
            const bottomLight = new THREE.PointLight(0x00aa00, 0.8, 60);
            bottomLight.position.set(0, -15, 0);
            scene.add(bottomLight);

            // 內部暖光
            const innerLight = new THREE.PointLight(0xffaa00, 1.5, 40);
            innerLight.position.set(0, 0, 0);
            mainGroup.add(innerLight);

            // 頂部聚光燈
            const topSpot = new THREE.SpotLight(0xffcc66, 500);
            topSpot.position.set(0, 40, 35);
            topSpot.angle = 0.6;
            topSpot.penumbra = 0.5;
            scene.add(topSpot);

            // 藍色補光（冷暖對比）
            const blueLight = new THREE.PointLight(0x4488ff, 0.5, 80);
            blueLight.position.set(20, -5, 20);
            scene.add(blueLight);
        }

        function setupPostProcessing() {
            const renderScene = new RenderPass(scene, camera);
            // 增強的輝光效果 - 參數: 解析度, 強度, 半徑, 閾值
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                1.5,   // 強度
                0.4,   // 半徑
                0.85   // 閾值
            );
            // 更強的輝光效果
            bloomPass.threshold = 0.6;
            bloomPass.strength = 1.2;
            bloomPass.radius = 0.5;

            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);
        }

        function createTextures() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0,0,128,128);
            ctx.fillStyle = '#880000';
            ctx.beginPath();
            for(let i=-128; i<256; i+=32) {
                ctx.moveTo(i, 0); ctx.lineTo(i+32, 128); ctx.lineTo(i+16, 128); ctx.lineTo(i-16, 0);
            }
            ctx.fill();
            caneTexture = new THREE.CanvasTexture(canvas);
            caneTexture.wrapS = THREE.RepeatWrapping;
            caneTexture.wrapT = THREE.RepeatWrapping;
            caneTexture.repeat.set(3, 3);
        }

        // 用於追蹤照片和特效
        let photoIndex = 0;
        let totalPhotoCount = 0;
        let goldRings = [];      // 金色光環
        let snowParticles = [];  // 雪花粒子
        let photoCircleAngle = 0; // 照片圍繞旋轉角度

        class Particle {
            constructor(mesh, type, isDust = false) {
                this.mesh = mesh;
                this.type = type;
                this.isDust = isDust;

                // 合攏態和散開態的位置
                this.collapsedPos = new THREE.Vector3();
                this.scatteredPos = new THREE.Vector3();
                this.groundPos = new THREE.Vector3(); // 照片散落地面位置
                this.baseScale = mesh.scale.x;

                // 照片專用
                this.photoCircleIndex = -1;
                this.photoAngleOffset = Math.random() * Math.PI * 2;

                // 自轉速度
                const speedMult = (type === 'PHOTO') ? 0.1 : 1.0;
                this.rotationSpeed = new THREE.Vector3(
                    Math.random() * 0.02 * speedMult,
                    Math.random() * 0.02 * speedMult,
                    Math.random() * 0.02 * speedMult
                );

                this.calculatePositions();
            }

            calculatePositions() {
                const h = CONFIG.particles.treeHeight;
                const r = CONFIG.particles.treeRadius;
                const scatterR = CONFIG.particles.scatterRadius;

                // === 計算【合攏態】位置 (圓錐體分布) ===
                const angle = Math.random() * Math.PI * 2;
                const heightRatio = Math.random();
                const y = (heightRatio - 0.5) * h;
                let currentRadius = (1 - heightRatio) * r;
                if (currentRadius < 0.5) currentRadius = 0.5;
                const x = Math.cos(angle) * currentRadius;
                const z = Math.sin(angle) * currentRadius;
                this.collapsedPos.set(x, y, z);

                // === 計算【散開態】位置 ===
                if (this.type === 'PHOTO') {
                    // 照片：圍成圈旋轉（動態計算）
                    this.scatteredPos.set(0, 0, 0);
                    // 照片散落地面位置（合攏時）
                    const groundAngle = Math.random() * Math.PI * 2;
                    const groundRadius = 8 + Math.random() * 12;
                    this.groundPos.set(
                        Math.cos(groundAngle) * groundRadius,
                        -h / 2 - 0.5, // 地面高度
                        Math.sin(groundAngle) * groundRadius
                    );
                } else if (this.isDust) {
                    this.scatteredPos.set(
                        (Math.random() - 0.5) * scatterR * 2.5,
                        (Math.random() - 0.5) * scatterR * 2.5,
                        (Math.random() - 0.5) * scatterR * 2.5
                    );
                } else {
                    // 一般裝飾品：球形分布
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos(2 * Math.random() - 1);
                    const radius = scatterR * (0.3 + Math.random() * 0.7);
                    this.scatteredPos.set(
                        radius * Math.sin(phi) * Math.cos(theta),
                        radius * Math.sin(phi) * Math.sin(theta),
                        radius * Math.cos(phi)
                    );
                }
            }

            // 設定照片在圓環中的位置（靜態索引）
            setPhotoCirclePosition(index, total) {
                this.photoCircleIndex = index;
                this.photoAngleOffset = (index / total) * Math.PI * 2;
            }

            // 獲取照片旋轉圈的當前位置
            getPhotoCirclePosition(globalAngle) {
                const circleRadius = CONFIG.particles.photoCircleRadius;
                const angle = globalAngle + this.photoAngleOffset;
                const y = Math.sin(this.photoAngleOffset * 2) * 3; // 輕微高低起伏
                return new THREE.Vector3(
                    Math.cos(angle) * circleRadius,
                    y,
                    Math.sin(angle) * circleRadius
                );
            }

            update(dt, mode, focusTargetMesh) {
                let target;
                const lerpSpeed = CONFIG.transitionSpeed;

                // 根據當前狀態決定目標位置
                if (mode === STATES.COLLAPSED) {
                    if (this.type === 'PHOTO') {
                        // 照片散落地面
                        target = this.groundPos;
                    } else {
                        target = this.collapsedPos;
                    }
                } else if (mode === STATES.SCATTERED) {
                    if (this.type === 'PHOTO') {
                        // 照片圍成圈旋轉
                        target = this.getPhotoCirclePosition(photoCircleAngle);
                    } else {
                        target = this.scatteredPos;
                    }
                } else if (mode === STATES.FOCUS) {
                    if (this.mesh === focusTargetMesh) {
                        // 聚焦的照片移到螢幕中央
                        const desiredWorldPos = new THREE.Vector3(0, 5, 30);
                        const invMatrix = new THREE.Matrix4().copy(mainGroup.matrixWorld).invert();
                        target = desiredWorldPos.applyMatrix4(invMatrix);
                    } else if (this.type === 'PHOTO') {
                        // 其他照片繼續圍繞
                        target = this.getPhotoCirclePosition(photoCircleAngle);
                    } else {
                        target = this.scatteredPos;
                    }
                } else {
                    target = this.collapsedPos;
                }

                // 使用 lerp 平滑過渡
                this.mesh.position.lerp(target, lerpSpeed);

                // 旋轉處理
                if (this.type === 'PHOTO') {
                    if (mode === STATES.COLLAPSED) {
                        // 地面上的照片平躺，輕微傾斜
                        this.mesh.rotation.x = -Math.PI / 2 + (Math.random() - 0.5) * 0.3;
                        this.mesh.rotation.z = this.photoAngleOffset;
                    } else if (mode === STATES.SCATTERED || mode === STATES.FOCUS) {
                        if (this.mesh !== focusTargetMesh) {
                            // 照片面向中心
                            this.mesh.lookAt(new THREE.Vector3(0, 0, 0));
                        }
                    }
                } else {
                    this.mesh.rotation.x += this.rotationSpeed.x;
                    this.mesh.rotation.y += this.rotationSpeed.y;
                    this.mesh.rotation.z += this.rotationSpeed.z;
                }

                // 聚焦的照片面向攝影機
                if (mode === STATES.FOCUS && this.mesh === focusTargetMesh) {
                    this.mesh.lookAt(camera.position);
                }

                // 縮放處理
                let s = this.baseScale;
                if (this.isDust) {
                    s = this.baseScale * (0.8 + 0.4 * Math.sin(clock.elapsedTime * 4 + this.mesh.id));
                    if (mode === STATES.COLLAPSED) s = 0;
                } else if (this.type === 'PHOTO') {
                    if (mode === STATES.COLLAPSED) {
                        s = this.baseScale * 1.8; // 地面上的照片
                    } else if (mode === STATES.SCATTERED) {
                        s = this.baseScale * 2.2; // 圍繞時
                    } else if (mode === STATES.FOCUS) {
                        if (this.mesh === focusTargetMesh) {
                            s = 6.0; // 聚焦放大
                        } else {
                            s = this.baseScale * 1.5;
                        }
                    }
                } else if (mode === STATES.FOCUS) {
                    s = this.baseScale * 0.5;
                }

                this.mesh.scale.lerp(new THREE.Vector3(s, s, s), 4 * dt);
            }
        }

        // 更新所有照片的圓環位置索引
        function updatePhotoCirclePositions() {
            const photos = particleSystem.filter(p => p.type === 'PHOTO');
            totalPhotoCount = photos.length;
            photos.forEach((p, index) => {
                p.setPhotoCirclePosition(index, totalPhotoCount);
            });
        }

        function createParticles() {
            // === 幾何形狀 ===
            const sphereGeo = new THREE.SphereGeometry(0.5, 32, 32);
            const boxGeo = new THREE.BoxGeometry(0.55, 0.55, 0.55);

            // 糖果棍曲線
            const candyCurve = new THREE.CatmullRomCurve3([
                new THREE.Vector3(0, -0.5, 0), new THREE.Vector3(0, 0.3, 0),
                new THREE.Vector3(0.1, 0.5, 0), new THREE.Vector3(0.3, 0.4, 0)
            ]);
            const candyGeo = new THREE.TubeGeometry(candyCurve, 16, 0.08, 8, false);

            // 雪花幾何（六邊形）
            const snowflakeShape = new THREE.Shape();
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                const nextAngle = ((i + 1) / 6) * Math.PI * 2;
                const innerAngle = (i + 0.5) / 6 * Math.PI * 2;
                if (i === 0) snowflakeShape.moveTo(Math.cos(angle) * 0.5, Math.sin(angle) * 0.5);
                snowflakeShape.lineTo(Math.cos(innerAngle) * 0.2, Math.sin(innerAngle) * 0.2);
                snowflakeShape.lineTo(Math.cos(nextAngle) * 0.5, Math.sin(nextAngle) * 0.5);
            }
            const snowflakeGeo = new THREE.ExtrudeGeometry(snowflakeShape, { depth: 0.02, bevelEnabled: false });

            // 星形裝飾幾何
            const starShape = new THREE.Shape();
            for (let i = 0; i < 5; i++) {
                const outerAngle = (i / 5) * Math.PI * 2 - Math.PI / 2;
                const innerAngle = ((i + 0.5) / 5) * Math.PI * 2 - Math.PI / 2;
                if (i === 0) starShape.moveTo(Math.cos(outerAngle) * 0.4, Math.sin(outerAngle) * 0.4);
                else starShape.lineTo(Math.cos(outerAngle) * 0.4, Math.sin(outerAngle) * 0.4);
                starShape.lineTo(Math.cos(innerAngle) * 0.15, Math.sin(innerAngle) * 0.15);
            }
            starShape.closePath();
            const starOrnamentGeo = new THREE.ExtrudeGeometry(starShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02 });

            // 薑餅人幾何
            const gingerbreadGeo = createGingerbreadGeometry();

            // === 高級材質定義 ===
            // 1. 啞光綠
            const matteGreenMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.deepGreen,
                roughness: 0.9,
                metalness: 0.1,
            });

            // 2. 金屬金（輝光主要來源）
            const metalGoldMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.champagneGold,
                roughness: 0.15,
                metalness: 0.9,
                emissive: 0x443300,
                emissiveIntensity: 0.4
            });

            // 3. 聖誕紅
            const satinRedMat = new THREE.MeshPhysicalMaterial({
                color: CONFIG.colors.accentRed,
                roughness: 0.3,
                metalness: 0.3,
                clearcoat: 0.8,
                emissive: 0x330000,
                emissiveIntensity: 0.2
            });

            // 糖果棍材質
            const candyMat = new THREE.MeshStandardMaterial({ map: caneTexture, roughness: 0.4 });

            // 雪花材質
            const snowMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.snowWhite,
                metalness: 0.1, roughness: 0.3,
                emissive: 0xaaddff,
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.9
            });

            // 銀色材質
            const silverMat = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                metalness: 1.0, roughness: 0.1,
                emissive: 0x444444,
                emissiveIntensity: 0.3
            });

            // 薑餅人材質
            const gingerbreadMat = new THREE.MeshStandardMaterial({
                color: CONFIG.colors.gingerbread,
                roughness: 0.9, metalness: 0.0,
            });

            // === 創建裝飾品 ===
            for (let i = 0; i < CONFIG.particles.count; i++) {
                const rand = Math.random();
                let mesh, type;

                if (rand < 0.18) {
                    // 啞光綠球
                    mesh = new THREE.Mesh(sphereGeo, matteGreenMat);
                    type = 'GREEN_BALL';
                } else if (rand < 0.33) {
                    // 金屬金球
                    mesh = new THREE.Mesh(sphereGeo, metalGoldMat);
                    type = 'GOLD_BALL';
                } else if (rand < 0.45) {
                    // 聖誕紅球
                    mesh = new THREE.Mesh(sphereGeo, satinRedMat);
                    type = 'RED_BALL';
                } else if (rand < 0.52) {
                    // 銀球
                    mesh = new THREE.Mesh(sphereGeo, silverMat);
                    type = 'SILVER_BALL';
                } else if (rand < 0.62) {
                    // 糖果棍
                    mesh = new THREE.Mesh(candyGeo, candyMat);
                    type = 'CANDY_CANE';
                } else if (rand < 0.72) {
                    // 雪花
                    mesh = new THREE.Mesh(snowflakeGeo, snowMat);
                    type = 'SNOWFLAKE';
                } else if (rand < 0.82) {
                    // 星形裝飾
                    mesh = new THREE.Mesh(starOrnamentGeo, metalGoldMat.clone());
                    mesh.material.emissive = new THREE.Color(0xffaa00);
                    mesh.material.emissiveIntensity = 0.6;
                    type = 'STAR_ORNAMENT';
                } else if (rand < 0.90) {
                    // 薑餅人
                    mesh = new THREE.Mesh(gingerbreadGeo, gingerbreadMat);
                    type = 'GINGERBREAD';
                } else {
                    // 金色方塊
                    mesh = new THREE.Mesh(boxGeo, metalGoldMat);
                    type = 'GOLD_BOX';
                }

                const s = 0.4 + Math.random() * 0.5;
                mesh.scale.set(s, s, s);
                mesh.rotation.set(Math.random() * 6, Math.random() * 6, Math.random() * 6);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                mainGroup.add(mesh);
                particleSystem.push(new Particle(mesh, type, false));
            }

            // === 頂部星星 ===
            const topStarGeo = new THREE.OctahedronGeometry(1.5, 0);
            const topStarMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xffd700,
                emissiveIntensity: 2.5,
                toneMapped: false
            });
            const topStar = new THREE.Mesh(topStarGeo, topStarMat);
            topStar.position.set(0, CONFIG.particles.treeHeight / 2 + 2, 0);
            mainGroup.add(topStar);
            const starParticle = new Particle(topStar, 'TOP_STAR', false);
            starParticle.collapsedPos.set(0, CONFIG.particles.treeHeight / 2 + 2, 0);
            starParticle.scatteredPos.set(0, CONFIG.particles.scatterRadius * 0.6, 0);
            particleSystem.push(starParticle);

            // === 閃爍燈光 ===
            createStringLights();

            // === 禮盒 ===
            createGiftBoxes();

            // === 金色光環 (環繞聖誕樹) ===
            createGoldRings();

            // === 漫天雪花 ===
            createSnowfall();

            mainGroup.add(photoMeshGroup);
        }

        // 創建金色光環環繞聖誕樹
        function createGoldRings() {
            const ringCount = CONFIG.particles.goldRingCount;
            const treeHeight = CONFIG.particles.treeHeight;

            for (let i = 0; i < ringCount; i++) {
                // 計算每個光環的高度和半徑
                const heightRatio = (i + 0.5) / ringCount;
                const y = (heightRatio - 0.5) * treeHeight;
                const radius = CONFIG.particles.treeRadius * (1 - heightRatio) * 1.2 + 1;

                // 創建光環幾何
                const ringGeo = new THREE.TorusGeometry(radius, 0.08, 8, 64);
                const ringMat = new THREE.MeshBasicMaterial({
                    color: 0xffd700,
                    transparent: true,
                    opacity: 0.9
                });

                const ring = new THREE.Mesh(ringGeo, ringMat);
                ring.position.set(0, y, 0);
                ring.rotation.x = Math.PI / 2;
                ring.userData.baseY = y;
                ring.userData.phase = i * 0.5;

                mainGroup.add(ring);
                goldRings.push(ring);
            }
        }

        // 創建漫天雪花
        function createSnowfall() {
            const snowGeo = new THREE.BufferGeometry();
            const snowCount = CONFIG.particles.snowCount;
            const positions = new Float32Array(snowCount * 3);
            const velocities = [];

            const range = 60;
            const height = 80;

            for (let i = 0; i < snowCount; i++) {
                positions[i * 3] = (Math.random() - 0.5) * range;
                positions[i * 3 + 1] = Math.random() * height - 20;
                positions[i * 3 + 2] = (Math.random() - 0.5) * range;

                velocities.push({
                    x: (Math.random() - 0.5) * 0.02,
                    y: -0.05 - Math.random() * 0.1,
                    z: (Math.random() - 0.5) * 0.02
                });
            }

            snowGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

            const snowMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.3,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending
            });

            const snow = new THREE.Points(snowGeo, snowMat);
            snow.userData.velocities = velocities;
            scene.add(snow);
            snowParticles.push(snow);
        }

        // 更新雪花位置
        function updateSnowfall() {
            snowParticles.forEach(snow => {
                const positions = snow.geometry.attributes.position.array;
                const velocities = snow.userData.velocities;
                const range = 60;
                const height = 80;

                for (let i = 0; i < velocities.length; i++) {
                    positions[i * 3] += velocities[i].x;
                    positions[i * 3 + 1] += velocities[i].y;
                    positions[i * 3 + 2] += velocities[i].z;

                    // 重置超出範圍的雪花
                    if (positions[i * 3 + 1] < -20) {
                        positions[i * 3] = (Math.random() - 0.5) * range;
                        positions[i * 3 + 1] = height / 2;
                        positions[i * 3 + 2] = (Math.random() - 0.5) * range;
                    }
                }

                snow.geometry.attributes.position.needsUpdate = true;
            });
        }

        // 更新金色光環
        function updateGoldRings(dt, mode) {
            goldRings.forEach((ring, index) => {
                // 合攏時顯示並旋轉，散開時隱藏
                if (mode === STATES.COLLAPSED) {
                    ring.visible = true;
                    ring.rotation.z += 0.3 * dt;
                    // 輕微上下浮動
                    ring.position.y = ring.userData.baseY + Math.sin(clock.elapsedTime * 2 + ring.userData.phase) * 0.3;
                    // 閃爍效果
                    ring.material.opacity = 0.6 + 0.4 * Math.sin(clock.elapsedTime * 3 + ring.userData.phase);
                } else {
                    // 淡出
                    ring.material.opacity = Math.max(0, ring.material.opacity - dt * 2);
                    if (ring.material.opacity <= 0) {
                        ring.visible = false;
                    }
                }
            });
        }

        // Create gingerbread man geometry
        function createGingerbreadGeometry() {
            const shape = new THREE.Shape();
            // Head
            shape.absarc(0, 0.35, 0.15, 0, Math.PI * 2);
            // Body
            shape.moveTo(-0.12, 0.2);
            shape.lineTo(-0.15, -0.1);
            shape.lineTo(-0.25, -0.15); // left arm
            shape.lineTo(-0.15, -0.2);
            shape.lineTo(-0.12, -0.35);
            shape.lineTo(-0.18, -0.5); // left leg
            shape.lineTo(-0.08, -0.45);
            shape.lineTo(0, -0.35);
            shape.lineTo(0.08, -0.45);
            shape.lineTo(0.18, -0.5); // right leg
            shape.lineTo(0.12, -0.35);
            shape.lineTo(0.15, -0.2);
            shape.lineTo(0.25, -0.15); // right arm
            shape.lineTo(0.15, -0.1);
            shape.lineTo(0.12, 0.2);
            shape.closePath();

            return new THREE.ExtrudeGeometry(shape, { depth: 0.06, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02 });
        }

        // Create twinkling string lights
        function createStringLights() {
            const lightGeo = new THREE.SphereGeometry(0.1, 8, 8);
            const lightColors = [0xff0000, 0x00ff00, 0x0000ff, 0xffff00, 0xff00ff, 0x00ffff, 0xffffff, 0xffaa00];

            for (let i = 0; i < CONFIG.particles.stringLightCount; i++) {
                const colorIndex = Math.floor(Math.random() * lightColors.length);
                const lightMat = new THREE.MeshBasicMaterial({
                    color: lightColors[colorIndex],
                    transparent: true,
                    opacity: 0.9
                });

                const light = new THREE.Mesh(lightGeo, lightMat);
                light.userData.baseColor = lightColors[colorIndex];
                light.userData.twinklePhase = Math.random() * Math.PI * 2;
                light.userData.twinkleSpeed = 2 + Math.random() * 4;

                mainGroup.add(light);
                particleSystem.push(new Particle(light, 'STRING_LIGHT', false));
            }
        }

        // Create gift boxes with ribbons under tree
        function createGiftBoxes() {
            const giftColors = [0xff0000, 0x00aa00, 0x0066cc, 0xffcc00, 0xff6600, 0x9933ff];
            const ribbonColor = 0xffd700;

            for (let i = 0; i < CONFIG.particles.giftBoxCount; i++) {
                const group = new THREE.Group();

                // Random size
                const w = 0.8 + Math.random() * 0.8;
                const h = 0.6 + Math.random() * 0.6;
                const d = 0.8 + Math.random() * 0.8;

                // Box
                const boxGeo = new THREE.BoxGeometry(w, h, d);
                const boxColor = giftColors[Math.floor(Math.random() * giftColors.length)];
                const boxMat = new THREE.MeshStandardMaterial({
                    color: boxColor,
                    roughness: 0.4,
                    metalness: 0.1
                });
                const box = new THREE.Mesh(boxGeo, boxMat);
                group.add(box);

                // Ribbon horizontal
                const ribbonMat = new THREE.MeshStandardMaterial({
                    color: ribbonColor,
                    metalness: 0.8,
                    roughness: 0.2
                });
                const ribbonH = new THREE.Mesh(
                    new THREE.BoxGeometry(w + 0.02, 0.08, d + 0.02),
                    ribbonMat
                );
                ribbonH.position.y = h * 0.1;
                group.add(ribbonH);

                // Ribbon vertical
                const ribbonV = new THREE.Mesh(
                    new THREE.BoxGeometry(0.08, h + 0.02, d + 0.02),
                    ribbonMat
                );
                ribbonV.position.y = 0;
                group.add(ribbonV);

                // Bow (two loops)
                const bowGeo = new THREE.TorusGeometry(0.15, 0.04, 8, 16);
                const bow1 = new THREE.Mesh(bowGeo, ribbonMat);
                bow1.position.set(-0.12, h / 2 + 0.1, 0);
                bow1.rotation.y = Math.PI / 2;
                bow1.rotation.x = Math.PI / 4;
                group.add(bow1);

                const bow2 = new THREE.Mesh(bowGeo, ribbonMat);
                bow2.position.set(0.12, h / 2 + 0.1, 0);
                bow2.rotation.y = Math.PI / 2;
                bow2.rotation.x = -Math.PI / 4;
                group.add(bow2);

                // Position under tree
                const angle = Math.random() * Math.PI * 2;
                const radius = 2 + Math.random() * 4;
                group.position.set(
                    Math.cos(angle) * radius,
                    -CONFIG.particles.treeHeight / 2 + h / 2,
                    Math.sin(angle) * radius
                );
                group.rotation.y = Math.random() * Math.PI * 2;

                mainGroup.add(group);
                // Gift boxes don't participate in particle system (stay fixed)
            }
        }

        function createDust() {
            const geo = new THREE.TetrahedronGeometry(0.08, 0);
            const mat = new THREE.MeshBasicMaterial({ color: 0xffeebb, transparent: true, opacity: 0.8 });

            for(let i=0; i<CONFIG.particles.dustCount; i++) {
                 const mesh = new THREE.Mesh(geo, mat);
                 mesh.scale.setScalar(0.5 + Math.random());
                 mainGroup.add(mesh);
                 particleSystem.push(new Particle(mesh, 'DUST', true));
            }
        }

        function createDefaultPhotos() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#050505'; ctx.fillRect(0,0,512,512);
            ctx.strokeStyle = '#eebb66'; ctx.lineWidth = 15; ctx.strokeRect(20,20,472,472);
            ctx.font = '500 60px Times New Roman'; ctx.fillStyle = '#eebb66';
            ctx.textAlign = 'center';
            ctx.fillText("JOYEUX", 256, 230);
            ctx.fillText("NOEL", 256, 300);

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            addPhotoToScene(tex);
        }

        function addPhotoToScene(texture) {
            // Get image dimensions from texture
            const image = texture.image;
            let aspectRatio = 1;
            if (image && image.width && image.height) {
                aspectRatio = image.width / image.height;
            }

            // Ensure texture is centered and not repeated
            texture.center.set(0.5, 0.5);
            texture.wrapS = THREE.ClampToEdgeWrapping;
            texture.wrapT = THREE.ClampToEdgeWrapping;

            // Calculate frame dimensions based on aspect ratio
            const maxSize = 1.4;
            let frameWidth, frameHeight;
            if (aspectRatio >= 1) {
                // Landscape or square
                frameWidth = maxSize;
                frameHeight = maxSize / aspectRatio;
            } else {
                // Portrait
                frameHeight = maxSize;
                frameWidth = maxSize * aspectRatio;
            }

            // Frame with border
            const borderSize = 0.1;
            const frameGeo = new THREE.BoxGeometry(frameWidth + borderSize, frameHeight + borderSize, 0.05);
            const frameMat = new THREE.MeshStandardMaterial({ color: CONFIG.colors.champagneGold, metalness: 1.0, roughness: 0.1 });
            const frame = new THREE.Mesh(frameGeo, frameMat);

            // Photo plane matching aspect ratio - centered at origin
            const photoGeo = new THREE.PlaneGeometry(frameWidth, frameHeight);
            const photoMat = new THREE.MeshBasicMaterial({ map: texture, side: THREE.DoubleSide });
            const photo = new THREE.Mesh(photoGeo, photoMat);
            photo.position.set(0, 0, 0.04); // Centered, slightly in front of frame

            const group = new THREE.Group();
            group.add(frame);
            group.add(photo);

            const s = 0.8;
            group.scale.set(s,s,s);

            photoMeshGroup.add(group);
            particleSystem.push(new Particle(group, 'PHOTO', false));
            // 更新照片立體圈位置
            updatePhotoCirclePositions();
            return group;
        }

        // Track photo meshes for deletion
        let userPhotoMeshes = [];

        // Upload image to Firebase Storage
        async function uploadToFirebase(file) {
            const timestamp = Date.now();
            const fileName = `photos/${timestamp}_${file.name}`;
            const storageRefPath = fileName;

            try {
                // Upload file
                const snapshot = await window.firebaseStorage.ref(storageRefPath).put(file);
                // Get download URL
                const downloadURL = await snapshot.ref.getDownloadURL();
                console.log('Uploaded to Firebase:', downloadURL);
                return { url: downloadURL, storageRef: storageRefPath, fileName: file.name };
            } catch (error) {
                console.error('Firebase upload error:', error);
                return null;
            }
        }

        // Load all images from Firebase Storage
        async function loadPhotosFromFirebase() {
            try {
                const listRef = window.firebaseStorage.ref('photos');
                const result = await listRef.listAll();

                for (const itemRef of result.items) {
                    const url = await itemRef.getDownloadURL();
                    const fileName = itemRef.name;
                    const storageRef = itemRef.fullPath;
                    loadPhotoFromURL(url, fileName, storageRef);
                }
                console.log(`Loaded ${result.items.length} photos from Firebase`);
            } catch (error) {
                console.warn('Could not load photos from Firebase:', error);
            }
        }

        // Load photo from URL and add to scene
        function loadPhotoFromURL(url, fileName = 'photo', storageRef = null) {
            // Check if this photo is already loaded (prevent duplicates)
            const exists = window.uploadedPhotos && window.uploadedPhotos.some(p => p.url === url);
            if (exists) {
                console.log('Photo already loaded, skipping:', fileName);
                return;
            }

            // Create texture loader with crossOrigin
            const loader = new THREE.TextureLoader();
            loader.crossOrigin = 'anonymous';

            loader.load(url, (t) => {
                t.colorSpace = THREE.SRGBColorSpace;
                const mesh = addPhotoToScene(t);
                userPhotoMeshes.push(mesh);
                // Add to manager
                if (window.addPhotoToManager) {
                    window.addPhotoToManager(fileName, url, storageRef);
                    console.log('Added to manager:', fileName);
                }
            },
            (progress) => {
                console.log('Loading photo:', fileName, Math.round((progress.loaded / progress.total) * 100) + '%');
            },
            (err) => {
                console.warn('Failed to load photo:', url, err);
            });
        }

        // Remove photo from scene
        window.removePhotoFromScene = function(index) {
            if (index >= 0 && index < userPhotoMeshes.length) {
                const mesh = userPhotoMeshes[index];
                if (mesh) {
                    photoMeshGroup.remove(mesh);
                    // Remove from particle system
                    const particleIndex = particleSystem.findIndex(p => p.mesh === mesh);
                    if (particleIndex !== -1) {
                        particleSystem.splice(particleIndex, 1);
                    }
                }
                userPhotoMeshes.splice(index, 1);
            }
        };

        function handleImageUpload(e) {
            const files = e.target.files;
            if(!files.length) return;
            Array.from(files).forEach(async (f) => {
                // Upload to Firebase first
                const result = await uploadToFirebase(f);

                if (result) {
                    // Load into scene and add to manager
                    new THREE.TextureLoader().load(result.url, (t) => {
                        t.colorSpace = THREE.SRGBColorSpace;
                        const mesh = addPhotoToScene(t);
                        userPhotoMeshes.push(mesh);
                        // Add to manager
                        if (window.addPhotoToManager) {
                            window.addPhotoToManager(f.name, result.url, result.storageRef);
                        }
                    });
                }
            });
            // Reset input
            e.target.value = '';
        }

        // --- MEDIAPIPE ---
        async function initMediaPipe() {
            video = document.getElementById('webcam');
            webcamCanvas = document.getElementById('webcam-preview');
            webcamCtx = webcamCanvas.getContext('2d');
            webcamCanvas.width = 160; webcamCanvas.height = 120;

            try {
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
                );
                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: `https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task`,
                        delegate: "GPU"
                    },
                    runningMode: "VIDEO",
                    numHands: 1
                });

                if (navigator.mediaDevices?.getUserMedia) {
                    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    video.srcObject = stream;
                    video.addEventListener("loadeddata", predictWebcam);
                    document.getElementById('webcam-wrapper').classList.add('active');
                }
            } catch (err) {
                console.warn('MediaPipe init failed, using keyboard only:', err);
                document.getElementById('status').textContent = 'Keyboard Mode';
            }
        }

        let lastVideoTime = -1;
        async function predictWebcam() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                if (handLandmarker) {
                    const result = handLandmarker.detectForVideo(video, performance.now());
                    processGestures(result);
                }
            }
            requestAnimationFrame(predictWebcam);
        }

        function processGestures(result) {
            const gestureIndicator = document.getElementById('gesture-indicator');
            const status = document.getElementById('status');

            if (result.landmarks && result.landmarks.length > 0) {
                STATE.hand.detected = true;
                gestureIndicator.classList.add('active');

                const lm = result.landmarks[0];
                STATE.hand.x = (lm[9].x - 0.5) * 2;
                STATE.hand.y = (lm[9].y - 0.5) * 2;

                const thumb = lm[4]; const index = lm[8]; const wrist = lm[0];
                const pinchDist = Math.hypot(thumb.x - index.x, thumb.y - index.y);
                const tips = [lm[8], lm[12], lm[16], lm[20]];
                let avgDist = 0;
                tips.forEach(t => avgDist += Math.hypot(t.x - wrist.x, t.y - wrist.y));
                avgDist /= 4;

                if (pinchDist < 0.05) {
                    // 捏合 - 查看照片
                    gestureIndicator.textContent = '🤏';
                    if (STATE.mode !== STATES.FOCUS) {
                        STATE.mode = STATES.FOCUS;
                        STATE.autoRotate = false;
                        status.textContent = 'Viewing Photo';
                        updateGestureButtons();
                        const photos = particleSystem.filter(p => p.type === 'PHOTO');
                        if (photos.length) STATE.focusTarget = photos[Math.floor(Math.random()*photos.length)].mesh;
                    }
                } else if (avgDist < 0.25) {
                    // 握拳 - 合攏態
                    gestureIndicator.textContent = '✊';
                    STATE.mode = STATES.COLLAPSED;
                    STATE.autoRotate = true;
                    STATE.focusTarget = null;
                    status.textContent = 'Christmas Tree';
                    updateGestureButtons();
                } else if (avgDist > 0.4) {
                    // 張開手 - 散開態
                    gestureIndicator.textContent = '🖐️';
                    STATE.mode = STATES.SCATTERED;
                    STATE.autoRotate = false;
                    STATE.focusTarget = null;
                    status.textContent = 'Floating';
                    updateGestureButtons();
                }
            } else {
                STATE.hand.detected = false;
                gestureIndicator.classList.remove('active');
            }
        }

        // 更新按鈕狀態（新 UI 無高亮按鈕，保留空函數）
        function updateGestureButtons() {
            // 新 UI 不需要按鈕高亮切換
        }

        function setupEvents() {
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
                composer.setSize(window.innerWidth, window.innerHeight);
            });

            document.getElementById('file-input').addEventListener('change', handleImageUpload);

            // 按鈕事件 - 使用新 ID
            document.getElementById('btn-collapsed').addEventListener('click', () => {
                STATE.mode = STATES.COLLAPSED;
                STATE.autoRotate = true;
                STATE.focusTarget = null;
                console.log("切換狀態: 合攏 (COLLAPSED)");
            });

            document.getElementById('btn-scattered').addEventListener('click', () => {
                STATE.mode = STATES.SCATTERED;
                STATE.autoRotate = false;
                STATE.focusTarget = null;
                console.log("切換狀態: 散開 (SCATTERED)");
            });

            // Keyboard controls
            window.addEventListener('keydown', (e) => {
                if (e.key.toLowerCase() === 'h') {
                    const controlsPanel = document.getElementById('controls-panel');
                    const bottomHint = document.getElementById('bottom-hint');
                    if (controlsPanel) controlsPanel.style.display = controlsPanel.style.display === 'none' ? 'block' : 'none';
                    if (bottomHint) bottomHint.style.display = bottomHint.style.display === 'none' ? 'block' : 'none';
                }
                if (e.key === '1') {
                    STATE.mode = STATES.COLLAPSED;
                    STATE.autoRotate = true;
                    STATE.focusTarget = null;
                }
                if (e.key === '2') {
                    STATE.mode = STATES.SCATTERED;
                    STATE.autoRotate = false;
                    STATE.focusTarget = null;
                }
                if (e.key === 'Escape') {
                    if (STATE.mode === STATES.FOCUS) {
                        STATE.mode = STATES.SCATTERED;
                        STATE.autoRotate = false;
                        STATE.focusTarget = null;
                    } else if (STATE.mode === STATES.SCATTERED) {
                        STATE.mode = STATES.COLLAPSED;
                        STATE.autoRotate = true;
                    }
                    updateGestureButtons();
                }
            });

            // Mouse drag rotation
            let isDragging = false;
            let prevMouse = { x: 0, y: 0 };

            renderer.domElement.addEventListener('mousedown', (e) => {
                isDragging = true;
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
            });

            document.addEventListener('mouseup', () => {
                isDragging = false;
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - prevMouse.x;
                const dy = e.clientY - prevMouse.y;
                STATE.rotation.y += dx * 0.005;
                STATE.rotation.x = Math.max(-0.5, Math.min(0.5, STATE.rotation.x + dy * 0.003));
                prevMouse.x = e.clientX;
                prevMouse.y = e.clientY;
            });
        }

        function animate() {
            requestAnimationFrame(animate);
            const dt = clock.getDelta();

            // 更新照片圍繞旋轉角度
            if (STATE.mode === STATES.SCATTERED || STATE.mode === STATES.FOCUS) {
                photoCircleAngle += dt * 0.3; // 照片圍繞旋轉速度
            }

            // 旋轉邏輯
            if (STATE.mode === STATES.SCATTERED && STATE.hand.detected) {
                // 手勢控制旋轉
                const targetRotY = STATE.hand.x * Math.PI * 0.9;
                const targetRotX = STATE.hand.y * Math.PI * 0.25;
                STATE.rotation.y += (targetRotY - STATE.rotation.y) * 3.0 * dt;
                STATE.rotation.x += (targetRotX - STATE.rotation.x) * 3.0 * dt;
            } else {
                if (STATE.autoRotate) {
                    // 合攏時自動旋轉展示
                    STATE.rotation.y += 0.4 * dt;
                    STATE.rotation.x += (0 - STATE.rotation.x) * 2.0 * dt;
                } else {
                    // 散開時緩慢旋轉（場景整體）
                    STATE.rotation.y += 0.15 * dt;
                }
            }

            mainGroup.rotation.y = STATE.rotation.y;
            mainGroup.rotation.x = STATE.rotation.x;

            // 更新所有粒子
            particleSystem.forEach(p => p.update(dt, STATE.mode, STATE.focusTarget));

            // 更新金色光環
            updateGoldRings(dt, STATE.mode);

            // 更新雪花
            if (STATE.mode === STATES.COLLAPSED) {
                updateSnowfall();
                snowParticles.forEach(s => {
                    s.material.opacity = Math.min(0.8, s.material.opacity + dt);
                });
            } else {
                // 非合攏態時淡出雪花
                snowParticles.forEach(s => {
                    s.material.opacity = Math.max(0, s.material.opacity - dt * 0.5);
                });
            }

            // 閃爍燈光效果
            particleSystem.forEach(p => {
                if (p.type === 'STRING_LIGHT' && p.mesh.userData.twinklePhase !== undefined) {
                    const phase = p.mesh.userData.twinklePhase;
                    const speed = p.mesh.userData.twinkleSpeed;
                    const brightness = 0.5 + 0.5 * Math.sin(clock.elapsedTime * speed + phase);
                    p.mesh.material.opacity = 0.4 + brightness * 0.6;
                }
            });

            // 使用 composer 渲染（應用輝光效果）
            composer.render();
        }

        init();
    </script>
